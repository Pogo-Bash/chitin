<!doctype html>
<html><head><title>same-site, other origin</title></head>
<body>
<iframe id="f" src="https://sub.iframes.example/child.html"></iframe>
<script>
var results = { events: [] };
document.getElementById('f').addEventListener('load', function () { results.events.push('frame load'); });
window.addEventListener('load', function () { results.events.push('window load'); });
</script>
</body></html>

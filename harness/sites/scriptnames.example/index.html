<!doctype html><meta charset="utf-8"><title>scriptnames</title>
<script src="data:text/javascript,window.fromData=1"></script>
<script>
// Classic scripts with no https name: a data: URL (above) and a blob: URL; both run as part of the page, as in Chrome.
window.fromBlob = 0;
const s = document.createElement('script');
s.src = URL.createObjectURL(new Blob(['window.fromBlob = 1;'], { type: 'text/javascript' }));
document.head.appendChild(s);
</script>
<script>
// String timers: the script has no URL of its own (HTML timer initialization steps).
window.timeout = 0; window.interval = 0;
setTimeout('window.timeout = 1', 0);
const iv = setInterval('window.interval += 1; if (window.interval >= 2) clearInterval(' + 0 + ')', 5);
window.stopIv = () => clearInterval(iv);
</script>

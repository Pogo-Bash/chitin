<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>idb</title>
<!-- A transaction that stays active across awaits: a continuation that runs in the microtask checkpoint after the
     request's success event may issue the next request (the idb library, localforage and Dexie all do). -->
<script>
window.result = 'pending';
const req = (r) => new Promise((ok, no) => { r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
(async () => {
    try {
        const open = indexedDB.open('chain', 1);
        open.onupgradeneeded = () => open.result.createObjectStore('s');
        const db = await req(open);
        const tx = db.transaction('s', 'readwrite');
        const st = tx.objectStore('s');
        await req(st.put(41, 'a'));
        const a = await req(st.get('a'));
        await req(st.put(a + 1, 'a'));
        window.result = 'value ' + await req(st.get('a'));
        document.title = window.result;
    } catch (e) {
        window.result = 'failed ' + e.name + ': ' + e.message;
        document.title = window.result;
    }
})();
</script>
</html>

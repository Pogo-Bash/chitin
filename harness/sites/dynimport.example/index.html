<!doctype html><meta charset="utf-8"><title>dynimport</title>
<p id="s">start</p>
<script src="/sub/classic.js"></script>
<script>
// An inline classic script: import() with a root-absolute path, a relative one and an absolute URL, against the page's address
// space (tests/chrome/run.mjs, "dynamic import() from classic scripts").
window.inline = {};
Promise.allSettled([import('/root.mjs'), import('./rel.mjs'), import('https://dynimport.example/root.mjs')]).then((r) => {
    window.inline = r.map((x) => (x.status === 'fulfilled' ? x.value.name : 'ERR ' + x.reason));
});
</script>

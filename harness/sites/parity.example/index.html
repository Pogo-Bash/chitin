<!doctype html>
<html><head><meta charset="utf-8"><title>parity</title></head>
<body>
<p>Chrome-parity probes, group D (tests/chrome/run.mjs parityDGroup): Screen, ScreenOrientation, Permissions, Notification,
navigator, workers (nested, SharedWorker, module), initial about:blank and srcdoc iframes, Web Audio.</p>
<button id="tone" style="width:200px;height:60px">tone</button>
<script>
window.tone = { state: 'idle' };
document.getElementById('tone').addEventListener('click', async () => {
    const ctx = new AudioContext();
    const osc = new OscillatorNode(ctx, { frequency: 440 });
    const gain = new GainNode(ctx, { gain: 0.5 });
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    window.tone = { state: 'started', ctx };
    try { await ctx.resume(); } catch (e) { window.tone.error = String(e); }
    window.tone.state = ctx.state;
});
</script>
</body></html>

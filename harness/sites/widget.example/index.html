<!doctype html>
<html><head><title>widget</title></head>
<body style="margin:0;background:#2a9d8f">
<button id="b" style="display:block;width:200px;height:100px;border:0;background:#2a9d8f;color:#fff">solve</button>
<script>
// A stand-in for a challenge widget (no real challenge): a button the user clicks, a token posted to the parent.
var results = { got: [], clicks: 0 };
document.cookie = 'who=child';
localStorage.setItem('who', 'child');
document.getElementById('b').addEventListener('click', function () {
    results.clicks++;
    parent.postMessage({ type: 'token', value: 'tok-' + results.clicks }, '*');
});
try { parent.document; results.parentDocument = 'reachable'; } catch (e) { results.parentDocument = e.name; }
try { parent.localStorage; results.parentStorage = 'reachable'; } catch (e) { results.parentStorage = e.name; }
results.topIsParent = top === parent;
results.parentIsSelf = parent === window;
window.addEventListener('message', function (e) {
    results.got.push({ data: e.data, origin: e.origin, trusted: e.isTrusted, fromParent: e.source === parent, ports: e.ports.length });
    if (e.ports.length)
        e.ports[0].postMessage({ via: 'port', list: ['a', 'b'] });
});
parent.postMessage({ type: 'ready' }, '*');
</script>
</body></html>

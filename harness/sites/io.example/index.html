<!doctype html><meta charset="utf-8"><title>io</title>
<style>#box{width:100px;height:50px;background:#c00}</style>
<!-- IntersectionObserver on targets that start hidden and are shown later (YouTube's thumbnails: yt-image observes its img
     with rootMargin 10% while the results are still hidden, and sets src when the img enters the viewport). -->
<div id="wrap" hidden><img id="a" width="100" height="50"></div>
<div id="wrap2" style="display:none"><div id="box"></div></div>
<div id="d" style="width:60px;height:30px;background:#0c0"></div>
<div id="wrap3"><span id="c" style="display:inline-block;width:0;height:0"></span></div>
<script>
window.log = [];
const io = new IntersectionObserver((es) => es.forEach((e) => window.log.push(e.target.id + ':' + e.isIntersecting + ':' + (e.intersectionRect.height > 0))), { rootMargin: '10%', threshold: 0.01 });
for (const id of ['a', 'box', 'c']) io.observe(document.getElementById(id));
setTimeout(() => { document.getElementById('wrap').hidden = false; document.getElementById('wrap2').style.display = 'block'; const c = document.getElementById('c'); c.style.width = '80px'; c.style.height = '40px'; }, 600);
// Observed again after an unobserve in its own callback (YouTube's lazy images: the image component re-renders, takes the
// src away and observes the same img again): a fresh observation reports where the target is now.
let dSeen = 0;
const io2 = new IntersectionObserver((es, o) => es.forEach((e) => {
    window.log.push('d' + dSeen + ':' + e.isIntersecting + ':' + (e.intersectionRect.height > 0));
    o.unobserve(e.target);
    if (++dSeen < 3)
        setTimeout(() => o.observe(e.target), dSeen === 1 ? 0 : 200);
}), { rootMargin: '10%', threshold: 0.01 });
io2.observe(document.getElementById('d'));
setTimeout(() => { document.title = 'io done'; }, 1500);
</script>

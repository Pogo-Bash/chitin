     wrong, unknown algorithm), crossorigin on classic and module scripts, nomodule, a stylesheet with
     crossorigin. Each case pushes "<name>:<outcome>" into window.ran; the title becomes "done" 2 s after the parser. -->
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; script-src 'nonce-n0nce' 'unsafe-eval' 'strict-dynamic' https: http:; base-uri 'self'">

function mark(name, outcome) { ran.push(name + ':' + outcome); }

    const s = document.createElement('script');
    setup(s);
    s.onload = () => mark(name, 'load');
    s.onerror = () => mark(name, 'error');
    (parent || document.head).appendChild(s);
}
// Script-inserted scripts: 'strict-dynamic' trusts them whatever their nonce (CSP3 section 8.2).
add('dyn-idl-nonce', (s) => { s.nonce = 'n0nce'; s.src = 'a.js?dyn-idl-nonce'; });
add('dyn-no-nonce', (s) => { s.src = 'a.js?dyn-no-nonce'; });
add('dyn-sri-good', (s) => { s.integrity = 'sha384-ZDvMhjZKWIOTKssSu+VHItfPBqp1qS/UhaFI4WYSWhRXBV0hq0q5IrPF1278KCm6'; s.crossOrigin = 'anonymous'; s.src = 'a.js?dyn-sri-good'; });
add('dyn-sri-bad', (s) => { s.integrity = 'sha384-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'; s.src = 'a.js?dyn-sri-bad'; });
add('dyn-sri-unknown-alg', (s) => { s.integrity = 'md5-xxxx'; s.src = 'a.js?dyn-sri-unknown-alg'; });
add('dyn-module-crossorigin', (s) => { s.type = 'module'; s.crossOrigin = 'anonymous'; s.nonce = 'n0nce'; s.src = 'm.js?dyn-module-crossorigin'; });

<!-- Parser-inserted: only a matching nonce lets these run under 'strict-dynamic'. -->

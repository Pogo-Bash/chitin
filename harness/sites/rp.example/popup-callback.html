     The mock relying party's popup return page: hands the code to its opener (targetOrigin: its own origin) and closes. -->
<html><head><meta charset="utf-8"><title>returning</title></head>
<body><p id="m">returning…</p>
<script>
var q = new URLSearchParams(location.search);
var results = { hadOpener: !!window.opener };
if (window.opener) {
    window.opener.postMessage({ code: q.get('code'), state: q.get('state') }, location.origin);
    window.close();
} else {
    document.getElementById('m').textContent = 'no opener: this page must be opened by the site';
}
</script></body></html>

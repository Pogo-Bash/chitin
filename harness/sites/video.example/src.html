<title>video src</title>
<style>body { margin: 0 } video { display: block; width: 640px; height: 360px }</style>
<video id="v" muted playsinline></video>
<script>
// A 2 s VP9/Opus clip through <video src>: the events in order with readyState, and currentTime as it plays.
window.seen = [];
window.support = {
    vp9: MediaSource.isTypeSupported('video/webm; codecs="vp9"'),
    av01: MediaSource.isTypeSupported('video/mp4; codecs="av01.0.05M.08"'),
    avc1: MediaSource.isTypeSupported('video/mp4; codecs="avc1.4d401f"'),
    opus: MediaSource.isTypeSupported('audio/webm; codecs="opus"'),
    mp4a: MediaSource.isTypeSupported('audio/mp4; codecs="mp4a.40.2"'),
    canPlayWebm: document.createElement('video').canPlayType('video/webm; codecs="vp9, opus"'),
};
const v = document.getElementById('v');
for (const name of ['loadstart', 'durationchange', 'loadedmetadata', 'loadeddata', 'canplay', 'canplaythrough', 'play', 'playing', 'pause', 'ended', 'error', 'seeked'])
    v.addEventListener(name, () => seen.push(name + ':' + v.readyState));
window.times = [];
// Where the browser has requestVideoFrameCallback (Chrome): the top-left quadrant of each presented frame.
window.pixels = [];
if (v.requestVideoFrameCallback) {
    const c = document.createElement('canvas');
    c.width = 640; c.height = 360;
    const g = c.getContext('2d', { willReadFrequently: true });
    const onFrame = (now, meta) => {
        g.drawImage(v, 0, 0);
        pixels.push(meta.mediaTime.toFixed(2) + ':' + Array.from(g.getImageData(100, 100, 1, 1).data).slice(0, 3).join(','));
        v.requestVideoFrameCallback(onFrame);
    };
    v.requestVideoFrameCallback(onFrame);
}
v.addEventListener('timeupdate', () => times.push(Math.round(v.currentTime * 100) / 100));
v.src = 'vp9-opus.webm';
v.play().then(() => seen.push('play resolved'), (e) => seen.push('play rejected ' + e.name));
</script>

<!doctype html>
<html><head><title>offline audio</title></head>
<body>
<script>
// An OfflineAudioContext renders a graph to a buffer (Web Audio, "OfflineAudioContext"): an oscillator through a gain,
// a suspension part-way that the page resumes, the promise and the complete event. Chrome: all of it within a frame or two.
var results = { events: [] };
(async function () {
    try {
        var ctx = new OfflineAudioContext(1, 44100, 44100);
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        gain.gain.value = 0.5;
        osc.frequency.value = 1000;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(0);
        ctx.oncomplete = function (e) { results.events.push('complete ' + e.renderedBuffer.length); };
        ctx.suspend(0.5).then(function () {
            results.events.push('suspended ' + (ctx.currentTime >= 0.49 && ctx.currentTime <= 0.51) + ' ' + ctx.state);
            ctx.resume();
        });
        var promise = ctx.startRendering();
        results.events.push('started ' + ctx.state);
        var buffer = await promise;
        var data = buffer.getChannelData(0);
        var peak = 0;
        for (var i = 0; i < data.length; i++)
            peak = Math.max(peak, Math.abs(data[i]));
        results.events.push('rendered ' + buffer.length + ' ' + buffer.sampleRate + ' ' + buffer.numberOfChannels + ' peak ' + peak.toFixed(2) + ' ' + ctx.state);
    } catch (e) {
        results.events.push('error ' + e.name + ': ' + e.message);
    }
    document.title = 'done';
})();
</script>
</body></html>

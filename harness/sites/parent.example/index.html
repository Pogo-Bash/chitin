<!doctype html>
<html><head><title>parent</title></head>
<body style="margin:0;background:#ffffff">
<div style="height:40px">parent page</div>
<iframe id="f" src="https://widget.example/" title="widget" style="display:block;width:200px;height:100px;border:0;margin-left:20px"></iframe>
<script>
// Nested segments (tests/frames.test.mjs, tests/chrome/run.mjs): the parent of a cross-site iframe.
var results = { got: [], portGot: [], clicks: 0 };
document.cookie = 'who=parent';
localStorage.setItem('who', 'parent');
var f = document.getElementById('f');
results.contentDocumentIsNull = f.contentDocument === null;
try { f.contentWindow.document; results.cwDocument = 'reachable'; } catch (e) { results.cwDocument = e.name; }
results.cwParentIsWindow = f.contentWindow.parent === window;
results.cwSame = f.contentWindow === f.contentWindow;
document.addEventListener('click', function () { results.clicks++; });
var channel = new MessageChannel();
channel.port1.onmessage = function (e) { results.portGot.push(e.data); };
window.addEventListener('message', function (e) {
    results.got.push({ data: e.data, origin: e.origin, trusted: e.isTrusted, fromFrame: e.source === f.contentWindow });
    if (e.data && e.data.type === 'ready') {
        f.contentWindow.postMessage({ type: 'wrong origin' }, 'https://evil.example');
        e.source.postMessage({ type: 'hello', list: [1, 2, 3] }, e.origin, [channel.port2]);
    }
    if (e.data && e.data.type === 'token')
        document.title = 'token ' + e.data.value;
});
</script>
</body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grid and flex</title>
<style>
  html { background: #fff; }
  body { margin: 16px; font-family: "Noto Sans", sans-serif; font-size: 14px; color: #111; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: 1fr 2fr 1fr; grid-template-rows: 80px 120px; gap: 8px; width: 600px; }
  .grid > div { padding: 8px; color: white; }
  .a { background: #c0392b; grid-column: 1 / 3; }
  .b { background: #2980b9; }
  .c { background: #27ae60; grid-row: 2; }
  .d { background: #8e44ad; grid-column: 2 / 4; }
  .flex { display: flex; width: 600px; margin-top: 16px; border: 2px solid #333; }
  .flex > div { padding: 12px; }
  .f1 { flex: 1; background: #f1c40f; }
  .f2 { flex: 2; background: #e67e22; }
  .f3 { flex: 0 0 120px; background: #1abc9c; }
  .column { display: flex; flex-direction: column; width: 200px; height: 160px; margin-top: 16px; justify-content: space-between; background: #ecf0f1; }
  .column > div { background: #34495e; color: white; padding: 6px; }
  .wrap { display: flex; flex-wrap: wrap; width: 300px; gap: 6px; margin-top: 16px; }
  .wrap > div { width: 90px; height: 30px; background: #95a5a6; }
</style>
</head>
<body>
<h1>CSS grid and flexbox</h1>
<div class="grid">
  <div class="a">grid a: spans two columns</div>
  <div class="b">b</div>
  <div class="c">c: second row</div>
  <div class="d">d: spans columns 2 and 3</div>
</div>
<div class="flex"><div class="f1">flex 1</div><div class="f2">flex 2</div><div class="f3">120px</div></div>
<div class="column"><div>top</div><div>middle</div><div>bottom</div></div>
<div class="wrap"><div></div><div></div><div></div><div></div><div></div></div>
</body>
</html>

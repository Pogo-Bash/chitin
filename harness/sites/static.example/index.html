<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chitin: a static page</title>
<style>
  html { background: #ffffff; }
  body { margin: 0; font-family: "Noto Sans", sans-serif; color: #222; }
  #box { position: absolute; left: 20px; top: 20px; width: 100px; height: 60px; background: #e03030; }
  #bar { position: absolute; left: 140px; top: 20px; width: 200px; height: 60px; background: #3060e0; border: 4px solid #103080; }
  h1 { position: absolute; left: 20px; top: 100px; margin: 0; font-size: 32px; font-weight: bold; }
  p { position: absolute; left: 20px; top: 150px; width: 500px; font-size: 16px; line-height: 1.4; }
  .mono { font-family: "Noto Sans Mono", monospace; }
  .serif { font-family: "Noto Serif", serif; }
</style>
</head>
<body>
<div id="box"></div>
<div id="bar"></div>
<h1>Ganglion renders this page</h1>
<p>A static page: block boxes, borders, text in <span class="serif">serif</span> and <span class="mono">monospace</span> faces, laid out by LibWeb and rasterized by Skia on the CPU inside a wasm module, with no JavaScript run by the page.</p>
<noscript><p style="top: 300px">noscript: scripting is off in phase 1, so this paragraph shows.</p></noscript>
</body>
</html>
